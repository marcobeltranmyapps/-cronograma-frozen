<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de Asientos</title>
<style>
  :root {
    --bg: #0f1420;
    --card: #171d2b;
    --border: #232a3b;
    --text: #e8ecf4;
    --muted: #9aa4b8;
    --accent: #5b8def;
    --libre: #22c55e;
    --reserva: #f59e0b;
    --ocupado: #ef4444;
    --conadis: #2563eb;
  }
  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #0b0f1a, #131a2b);
    color: var(--text);
    padding: 32px 20px 60px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .subtitle-date { font-weight: 700; font-size: 12.5px; }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--accent);
    text-decoration: none;
    font-size: 13px;
    margin-bottom: 18px;
  }
  .back-link:hover { text-decoration: underline; }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
  }
  .tab-btn.active { border-color: var(--accent); color: var(--text); background: #1c2740; }

  .legend {
    display: flex;
    flex-wrap: nowrap;
    gap: 10px;
    margin-bottom: 16px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .legend span { white-space: nowrap; }
  .legend .sw {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 3px;
    margin-right: 4px;
    vertical-align: middle;
    flex-shrink: 0;
  }
  @media (max-width: 480px) {
    .legend { gap: 5px; font-size: 9.5px; }
    .legend .sw { width: 8px; height: 8px; margin-right: 2px; }
  }
  @media (max-width: 380px) {
    .legend { gap: 3px; font-size: 8.5px; }
  }

  .stage {
    text-align: center;
    background: #1c2740;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    margin-bottom: 16px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent);
  }

  .seatmap { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }

  .zone-block { display: flex; border-bottom: 3px solid var(--border); padding-bottom: 4px; }
  .zone-block:last-child { border-bottom: none; padding-bottom: 0; }
  .zone-sidebar {
    width: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    text-align: center;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 8px 4px;
    white-space: nowrap;
  }
  .zone-northuldra .zone-sidebar { background: #3a3424; color: #e8dfc8; }
  .zone-arendelle .zone-sidebar { background: #2a2a45; color: #c9c9ea; }
  .zone-ahtohallan .zone-sidebar { background: #1f3a45; color: #b9dcea; }

  .zone-rows { flex: 1; display: flex; flex-direction: column; background: var(--card); }
  .seat-row {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 3px 8px;
  }
  .fila-num { width: 20px; color: var(--muted); font-size: 10.5px; text-align: right; margin-right: 4px; flex-shrink: 0; }
  .seat {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .seat.libre { background: var(--libre); color: #062b0f; }
  .seat.reserva { background: var(--reserva); color: #3a2600; }
  .seat.ocupado { background: var(--ocupado); color: #fff; }
  .seat.conadis { background: var(--conadis); color: #fff; }
  .seat.spacer { visibility: hidden; }

  .verify-note {
    color: var(--muted);
    font-size: 12px;
    margin-top: 16px;
    line-height: 1.6;
  }

  .footer-nav-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background:
      radial-gradient(120% 160% at 10% 0%, rgba(255,255,255,0.18), transparent 55%),
      linear-gradient(135deg, #123456, #2d6f9e 55%, #8fd6ef 130%);
    border: 1px solid #a7e3f5;
    border-radius: 12px;
    padding: 16px 18px;
    color: #eaf6ff;
    text-decoration: none;
    font-size: 15px;
    font-weight: 700;
    margin-top: 20px;
    text-shadow: 0 0 10px rgba(180, 230, 255, 0.5);
    box-shadow: 0 0 18px rgba(143, 214, 239, 0.25), inset 0 0 20px rgba(255,255,255,0.08);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .footer-nav-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 26px rgba(143, 214, 239, 0.45), inset 0 0 20px rgba(255,255,255,0.1);
  }
  .footer-nav-btn .arrow { color: #eaf6ff; font-size: 15px; }

  @media (max-width: 640px) {
    body { padding: 20px 14px 48px; }
    h1 { font-size: 19px; }
    .zone-sidebar { width: 30px; font-size: 9.5px; padding: 6px 3px; }
    .seat-row { gap: 2px; padding: 2px 4px; }
    .seat { width: 15px; height: 15px; font-size: 7px; border-radius: 3px; }
    .fila-num { width: 13px; font-size: 8.5px; margin-right: 2px; }
  }

  @media (max-width: 400px) {
    .zone-sidebar { width: 24px; font-size: 8.5px; padding: 4px 2px; }
    .seat-row { gap: 1px; padding: 2px 3px; }
    .seat { width: 12px; height: 12px; font-size: 6px; border-radius: 2px; }
    .fila-num { width: 11px; font-size: 7.5px; margin-right: 1px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">&larr; Volver al menú</a>
  <h1>Mapa de Asientos</h1>
  <div class="subtitle">Una Aventura Congelada<br><span class="subtitle-date">Domingo 15 de noviembre de 2026</span></div>

  <div class="tabs">
    <div class="tab-btn active" data-target="show-3pm">Función 3:00pm</div>
    <div class="tab-btn" data-target="show-7pm">Función 7:00pm</div>
  </div>

  <div class="legend">
    <span><span class="sw" style="background:var(--libre)"></span>Libre (<span id="count-libre">0</span>)</span>
    <span><span class="sw" style="background:var(--reserva)"></span>Reserva (<span id="count-reserva">0</span>)</span>
    <span><span class="sw" style="background:var(--ocupado)"></span>Ocupado (<span id="count-ocupado">0</span>)</span>
    <span><span class="sw" style="background:var(--conadis)"></span>Conadis (<span id="count-conadis">0</span>)</span>
  </div>
  <div class="legend" style="margin-top:-8px">Aforo total: 278 entradas</div>

  <div id="show-3pm">
    <div class="stage">ESCENARIO 3PM</div>
    <div class="seatmap-wrap"><div class="seatmap" id="map-3pm"></div></div>
  </div>

  <div id="show-7pm" style="display:none">
    <div class="stage">ESCENARIO 7PM</div>
    <div class="seatmap-wrap"><div class="seatmap" id="map-7pm"></div></div>
  </div>

  <div class="verify-note">
    Última actualización: 01 sep 2026, 18:01
  </div>

  <a class="footer-nav-btn" href="entradas.html">Cómo comprar entradas <span class="arrow">→</span></a>
</div>

<script>
  const ZONES = [
    { key: 'northuldra', label: 'ZONA NORTHULDRA', rows: [1,2,3,4,5,6,7] },
    { key: 'arendelle', label: 'ARENDELLE', rows: [8,9,10,11,12] },
    { key: 'ahtohallan', label: 'AHTOHALLAN', rows: [13,14,15,16] },
  ];

  // Filas 1-4 tienen menos asientos y quedan desplazadas a la derecha (forma de abanico);
  // filas 5-16 tienen las 18 butacas completas.
  const ROW_SEAT_COUNT = { 1:14, 2:15, 3:16, 4:17, 5:18, 6:18, 7:18, 8:18, 9:18, 10:18, 11:18, 12:18, 13:18, 14:18, 15:18, 16:18 };
  const ROW_OFFSET = { 1:2, 2:1, 3:1, 4:0, 5:0, 6:0, 7:0, 8:0, 9:0, 10:0, 11:0, 12:0, 13:0, 14:0, 15:0, 16:0 };
  const TOTAL_AFORO = Object.values(ROW_SEAT_COUNT).reduce((a, b) => a + b, 0); // 278

  // status por función: { fila: { asiento: 'reserva' | 'ocupado' | 'conadis' } }
  const STATUS_3PM = {
    1: { 3: 'reserva', 4: 'reserva', 5: 'ocupado', 6: 'reserva', 7: 'reserva', 8: 'reserva', 9: 'reserva', 10: 'reserva', 11: 'reserva' },
    2: { 1: 'reserva', 2: 'reserva', 3: 'reserva', 4: 'reserva', 5: 'reserva', 6: 'reserva', 7: 'reserva' },
    3: { 7: 'reserva', 8: 'reserva', 9: 'reserva' },
    4: { 1: 'ocupado', 2: 'ocupado' },
    5: { 1: 'reserva', 2: 'reserva' },
    8: { 16: 'ocupado', 17: 'ocupado', 18: 'ocupado' },
    9: { 10: 'reserva', 11: 'reserva', 12: 'reserva', 13: 'reserva', 14: 'reserva', 15: 'reserva', 16: 'reserva', 17: 'reserva' },
    10: { 8: 'reserva', 9: 'reserva' },
    13: { 7: 'reserva', 8: 'reserva', 9: 'reserva', 10: 'reserva', 11: 'reserva', 12: 'reserva' },
    14: { 7: 'reserva', 8: 'reserva', 9: 'reserva', 10: 'reserva', 11: 'reserva', 12: 'reserva' },
    16: { 1: 'conadis', 2: 'conadis' },
  };
  const STATUS_7PM = {
    1: { 3: 'reserva', 4: 'reserva', 5: 'reserva', 6: 'reserva', 7: 'reserva', 8: 'ocupado' },
    2: { 6: 'reserva', 7: 'reserva', 8: 'reserva', 9: 'reserva', 10: 'reserva', 11: 'reserva' },
    3: { 7: 'ocupado', 8: 'ocupado', 9: 'reserva', 10: 'reserva', 11: 'reserva', 12: 'reserva' },
    4: { 1: 'reserva', 2: 'reserva', 3: 'reserva', 4: 'reserva', 8: 'ocupado', 9: 'ocupado', 10: 'ocupado' },
    5: { 1: 'reserva', 2: 'reserva', 3: 'reserva', 4: 'reserva', 5: 'reserva', 6: 'reserva', 9: 'reserva', 10: 'reserva', 11: 'reserva' },
    6: { 1: 'reserva', 2: 'reserva', 3: 'reserva', 4: 'reserva', 5: 'reserva', 6: 'reserva', 7: 'reserva', 8: 'reserva' },
    8: { 9: 'reserva', 10: 'reserva' },
    16: { 1: 'conadis', 2: 'conadis' },
  };

  function renderMap(containerId, statusMap) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    ZONES.forEach(zone => {
      const zoneBlock = document.createElement('div');
      zoneBlock.className = 'zone-block zone-' + zone.key;

      const sidebar = document.createElement('div');
      sidebar.className = 'zone-sidebar';
      sidebar.textContent = zone.label;
      zoneBlock.appendChild(sidebar);

      const rowsWrap = document.createElement('div');
      rowsWrap.className = 'zone-rows';

      zone.rows.forEach(rowNum => {
        const count = ROW_SEAT_COUNT[rowNum];
        const offset = ROW_OFFSET[rowNum];
        const rowEl = document.createElement('div');
        rowEl.className = 'seat-row';

        const filaEl = document.createElement('div');
        filaEl.className = 'fila-num';
        filaEl.textContent = rowNum;
        rowEl.appendChild(filaEl);

        for (let i = 0; i < offset; i++) {
          const spacer = document.createElement('div');
          spacer.className = 'seat spacer';
          rowEl.appendChild(spacer);
        }
        for (let seatNum = 1; seatNum <= count; seatNum++) {
          const seatEl = document.createElement('div');
          const status = (statusMap[rowNum] && statusMap[rowNum][seatNum]) || 'libre';
          seatEl.className = 'seat ' + status;
          seatEl.textContent = seatNum;
          rowEl.appendChild(seatEl);
        }
        rowsWrap.appendChild(rowEl);
      });

      zoneBlock.appendChild(rowsWrap);
      container.appendChild(zoneBlock);
    });
  }

  function updateLegendCounts(statusMap) {
    let reserva = 0, ocupado = 0, conadis = 0;
    Object.values(statusMap).forEach(rowStatuses => {
      Object.values(rowStatuses).forEach(status => {
        if (status === 'reserva') reserva++;
        else if (status === 'ocupado') ocupado++;
        else if (status === 'conadis') conadis++;
      });
    });
    const libre = TOTAL_AFORO - reserva - ocupado - conadis;
    document.getElementById('count-libre').textContent = libre;
    document.getElementById('count-reserva').textContent = reserva;
    document.getElementById('count-ocupado').textContent = ocupado;
    document.getElementById('count-conadis').textContent = conadis;
  }

  renderMap('map-3pm', STATUS_3PM);
  renderMap('map-7pm', STATUS_7PM);
  updateLegendCounts(STATUS_3PM);

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('show-3pm').style.display = btn.dataset.target === 'show-3pm' ? '' : 'none';
      document.getElementById('show-7pm').style.display = btn.dataset.target === 'show-7pm' ? '' : 'none';
      updateLegendCounts(btn.dataset.target === 'show-3pm' ? STATUS_3PM : STATUS_7PM);
    });
  });
</script>
</body>
</html>
