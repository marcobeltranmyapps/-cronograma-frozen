<style>
  :root {
    --bg: #0b0f1a;
    --card: #171d2b;
    --border: #232a3b;
    --text: #e8ecf4;
    --muted: #9aa4b8;
    --accent: #5b8def;
    --frost: #eaf6ff;
    --ice1: #123456;
    --ice2: #2d6f9e;
    --ice3: #8fd6ef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      linear-gradient(180deg, rgba(11,15,26,0.55), rgba(19,26,43,0.65)),
      url('images/banner-promo.jpg') center / cover no-repeat;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  .wrap { width: 100%; max-width: 440px; text-align: center; }
  .snow {
    font-size: 32px;
    margin-bottom: 6px;
    display: inline-block;
    filter: drop-shadow(0 0 8px rgba(180, 230, 255, 0.7));
    animation: snow-float 7s linear infinite;
  }
  @keyframes snow-float {
    0%   { transform: rotate(0deg)   scale(1);    opacity: 0.85; }
    25%  { transform: rotate(90deg)  scale(1.1);  opacity: 1;    }
    50%  { transform: rotate(180deg) scale(1);    opacity: 0.85; }
    75%  { transform: rotate(270deg) scale(1.1);  opacity: 1;    }
    100% { transform: rotate(360deg) scale(1);    opacity: 0.85; }
  }
  @media (prefers-reduced-motion: reduce) {
    .snow { animation: none; }
  }
  h1 {
    font-family: 'Mountains of Christmas', cursive;
    font-size: 34px;
    margin: 0 0 6px;
    line-height: 1.2;
    color: var(--frost);
    text-shadow: 0 0 12px rgba(143, 214, 239, 0.55), 0 0 2px #fff;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 28px;
  }

  .menu-group { text-align: left; }
  .menu-group + .menu-group { margin-top: 24px; }
  .menu-heading {
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0 0 10px 4px;
  }

  .menu-links { display: flex; flex-direction: column; gap: 10px; }

  .frost-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background:
      radial-gradient(120% 160% at 10% 0%, rgba(255,255,255,0.18), transparent 55%),
      linear-gradient(135deg, var(--ice1), var(--ice2) 55%, var(--ice3) 130%);
    border: 1px solid #a7e3f5;
    border-radius: 16px;
    padding: 16px 20px;
    text-decoration: none;
    box-shadow: 0 0 18px rgba(143, 214, 239, 0.25), inset 0 0 20px rgba(255,255,255,0.08);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .frost-btn:hover, .frost-btn:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 0 26px rgba(143, 214, 239, 0.45), inset 0 0 20px rgba(255,255,255,0.1);
  }
  .frost-btn .frost-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16.5px;
    font-weight: 700;
    color: var(--frost);
    text-shadow: 0 0 10px rgba(180, 230, 255, 0.6);
  }
  .frost-btn .frost-icon { font-size: 20px; filter: drop-shadow(0 0 6px rgba(180,230,255,0.8)); }
  .frost-btn .arrow { color: var(--frost); font-size: 16px; flex-shrink: 0; }

  .footnote {
    color: var(--muted);
    font-size: 12px;
    margin-top: 28px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="snow">❄</div>
  <h1>Una Aventura Congelada</h1>
  <div class="subtitle">Estreno: 15 de noviembre de 2026</div>

  <div class="menu-group">
    <div class="menu-heading">Función y venta de entradas</div>
    <div class="menu-links">
      <a class="frost-btn" href="/elenco.html">
        <span class="frost-label"><span class="frost-icon">🎭</span>Elenco</span>
        <span class="arrow">→</span>
      </a>
      <a class="frost-btn" href="/funciones.html">
        <span class="frost-label"><span class="frost-icon">📅</span>Funciones</span>
        <span class="arrow">→</span>
      </a>
      <a class="frost-btn" href="/asientos.html">
        <span class="frost-label"><span class="frost-icon">💺</span>Asientos</span>
        <span class="arrow">→</span>
      </a>
      <a class="frost-btn" href="/entradas.html">
        <span class="frost-label"><span class="frost-icon">🎫</span>Cómo comprar entradas</span>
        <span class="arrow">→</span>
      </a>
    </div>
  </div>

  <div class="footnote">Una producción de B612 Audiovisual</div>
</div>
</body>
</html>
