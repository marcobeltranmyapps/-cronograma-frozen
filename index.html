<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Una Aventura Congelada</title>
<style>
  :root {
    --bg: #0b0f1a;
    --card: #171d2b;
    --border: #232a3b;
    --text: #e8ecf4;
    --muted: #9aa4b8;
    --accent: #5b8def;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #0b0f1a, #131a2b);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  .wrap { width: 100%; max-width: 440px; text-align: center; }
  .snow { font-size: 32px; margin-bottom: 6px; }
  h1 {
    font-size: 26px;
    margin: 0 0 6px;
    line-height: 1.25;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 32px;
  }
  nav {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  nav a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    color: var(--text);
    text-decoration: none;
    font-size: 16px;
    font-weight: 500;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  nav a:hover, nav a:focus-visible {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  nav a .arrow { color: var(--muted); font-size: 15px; }
  .footnote {
    color: var(--muted);
    font-size: 12px;
    margin-top: 28px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="snow">❄</div>
  <h1>Una Aventura Congelada</h1>
  <div class="subtitle">Estreno: 15 de noviembre de 2026</div>

  <nav>
    <a href="elenco.html">Elenco <span class="arrow">→</span></a>
    <a href="funciones.html">Funciones <span class="arrow">→</span></a>
    <a href="cronograma.html">Ensayos <span class="arrow">→</span></a>
    <a href="vestuarios.html">Vestuarios <span class="arrow">→</span></a>
    <a href="entradas.html">Entradas <span class="arrow">→</span></a>
  </nav>

  <div class="footnote">B612 · Una Aventura Congelada</div>
</div>
</body>
</html>
