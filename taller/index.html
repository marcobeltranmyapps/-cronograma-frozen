<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Taller — Una Aventura Congelada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f1a;
    --card: #171d2b;
    --border: #232a3b;
    --text: #e8ecf4;
    --muted: #9aa4b8;
    --accent: #5b8def;
    --frost: #eaf6ff;
    --ice1: #123456;
    --ice2: #2d6f9e;
    --ice3: #8fd6ef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #0b0f1a, #131a2b);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  .wrap { width: 100%; max-width: 440px; text-align: center; }
  .snow {
    font-size: 32px;
    margin-bottom: 6px;
    display: inline-block;
    filter: drop-shadow(0 0 8px rgba(180, 230, 255, 0.7));
  }
  h1 {
    font-family: 'Mountains of Christmas', cursive;
    font-size: 30px;
    margin: 0 0 6px;
    line-height: 1.2;
    color: var(--frost);
    text-shadow: 0 0 12px rgba(143, 214, 239, 0.55), 0 0 2px #fff;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 28px;
  }

  .menu-group { text-align: left; }
  .menu-heading {
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0 0 10px 4px;
  }

  .menu-links { display: flex; flex-direction: column; gap: 10px; }

  .frost-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background:
      radial-gradient(120% 160% at 10% 0%, rgba(255,255,255,0.18), transparent 55%),
      linear-gradient(135deg, var(--ice1), var(--ice2) 55%, var(--ice3) 130%);
    border: 1px solid #a7e3f5;
    border-radius: 16px;
    padding: 16px 20px;
    text-decoration: none;
    box-shadow: 0 0 18px rgba(143, 214, 239, 0.25), inset 0 0 20px rgba(255,255,255,0.08);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .frost-btn:hover, .frost-btn:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 0 26px rgba(143, 214, 239, 0.45), inset 0 0 20px rgba(255,255,255,0.1);
  }
  .frost-btn .frost-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16.5px;
    font-weight: 700;
    color: var(--frost);
    text-shadow: 0 0 10px rgba(180, 230, 255, 0.6);
  }
  .frost-btn .frost-icon { font-size: 20px; filter: drop-shadow(0 0 6px rgba(180,230,255,0.8)); }
  .frost-btn .arrow { color: var(--frost); font-size: 16px; flex-shrink: 0; }

  .footnote {
    color: var(--muted);
    font-size: 12px;
    margin-top: 28px;
  }

  #panel { display: none; }

  .gate-wrap input[type="password"] {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 15px;
    margin-bottom: 12px;
    text-align: center;
  }
  .gate-wrap button {
    width: 100%;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 12px 14px;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .gate-error { color: #ef4444; font-size: 12.5px; margin-top: 10px; min-height: 16px; }

  .exit-btn {
    margin-top: 14px;
    background: none;
    box-shadow: none;
  }
  .exit-btn .frost-label, .exit-btn .arrow { color: var(--muted); text-shadow: none; }
</style>
</head>
<body>
<div class="wrap" id="gate">
  <div class="snow">❄</div>
  <h1>🔒 Taller</h1>
  <div class="subtitle">Panel interno del elenco</div>
  <input type="password" id="pwd-input" placeholder="Contraseña" autocomplete="off">
  <button type="button" id="pwd-submit">Entrar</button>
  <div class="gate-error" id="pwd-error"></div>
</div>

<div class="wrap" id="panel">
  <div class="snow">❄</div>
  <h1>Una Aventura Congelada</h1>
  <div class="subtitle">Taller — panel interno del elenco</div>

  <div class="menu-group">
    <div class="menu-heading">Información de la obra</div>
    <div class="menu-links">
      <a class="frost-btn" href="/taller/actividades.html">
        <span class="frost-label"><span class="frost-icon">📸</span>Actividades</span>
        <span class="arrow">→</span>
      </a>
      <a class="frost-btn" href="/taller/cronograma.html">
        <span class="frost-label"><span class="frost-icon">🗓️</span>Ensayos</span>
        <span class="arrow">→</span>
      </a>
      <a class="frost-btn" href="/taller/progreso.html">
        <span class="frost-label"><span class="frost-icon">📈</span>Progreso</span>
        <span class="arrow">→</span>
      </a>
      <a class="frost-btn" href="/taller/escenas.html">
        <span class="frost-label"><span class="frost-icon">🎬</span>Escenas</span>
        <span class="arrow">→</span>
      </a>
      <a class="frost-btn" href="/taller/ranking.html">
        <span class="frost-label"><span class="frost-icon">🏆</span>Ranking de ventas</span>
        <span class="arrow">→</span>
      </a>
      <a class="frost-btn" href="/taller/mis-asientos.html">
        <span class="frost-label"><span class="frost-icon">🪑</span>Ver mis asientos</span>
        <span class="arrow">→</span>
      </a>
    </div>
  </div>

  <a class="frost-btn exit-btn" href="/index.html" id="exit-btn">
    <span class="frost-label"><span class="frost-icon">🚪</span>Salir</span>
    <span class="arrow">→</span>
  </a>

  <div class="footnote">Una producción de B612 Audiovisual</div>
</div>

<script>
  const PASSWORD = 'fr0zen';
  const UNLOCK_KEY = 'taller_unlocked';
  const gate = document.getElementById('gate');
  const panel = document.getElementById('panel');
  const pwdInput = document.getElementById('pwd-input');
  const pwdError = document.getElementById('pwd-error');

  function unlock() {
    gate.style.display = 'none';
    panel.style.display = 'block';
  }

  // Si ya entró la contraseña correcta antes en este navegador, no se
  // vuelve a pedir — se guarda en localStorage (por dispositivo/navegador,
  // no expira solo hasta que se borren los datos del sitio).
  let alreadyUnlocked = false;
  try {
    alreadyUnlocked = localStorage.getItem(UNLOCK_KEY) === 'true';
  } catch (e) {
    // localStorage bloqueado (navegación privada, etc.) — se pide contraseña igual.
  }
  if (alreadyUnlocked) {
    unlock();
  }

  function tryUnlock() {
    if (pwdInput.value === PASSWORD) {
      try { localStorage.setItem(UNLOCK_KEY, 'true'); } catch (e) {}
      unlock();
    } else {
      pwdError.textContent = 'Contraseña incorrecta';
    }
  }
  document.getElementById('pwd-submit').addEventListener('click', tryUnlock);
  pwdInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });

  // "Salir" borra la sesión guardada — la próxima vez que se entre a
  // /taller vuelve a pedir la contraseña. Solo pasa acá, no por recargar
  // la página ni por navegar a otras páginas del taller.
  document.getElementById('exit-btn').addEventListener('click', () => {
    try { localStorage.removeItem(UNLOCK_KEY); } catch (e) {}
  });
</script>
</body>
</html>
