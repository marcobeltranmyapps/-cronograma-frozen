<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel interno</title>
<style>
  :root {
    --bg: #0f1420;
    --card: #171d2b;
    --border: #232a3b;
    --text: #e8ecf4;
    --muted: #9aa4b8;
    --accent: #5b8def;
  }
  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #0b0f1a, #131a2b);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  .gate-wrap { width: 100%; max-width: 340px; text-align: center; }
  .gate-wrap h1 { font-size: 18px; margin-bottom: 18px; }
  .gate-wrap input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 15px;
    margin-bottom: 12px;
    text-align: center;
  }
  .gate-wrap button {
    width: 100%;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 12px 14px;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .gate-error { color: #ef4444; font-size: 12.5px; margin-top: 10px; min-height: 16px; }

  .panel-wrap { display: none; width: 100%; max-width: 480px; text-align: center; }
  .panel-wrap h1 { font-size: 20px; margin-bottom: 4px; }
  .panel-wrap .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .open-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    color: var(--text);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  .open-btn:hover { border-color: var(--accent); }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(6, 9, 16, 0.8);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 100%;
    max-width: 720px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }
  .modal-head h2 { font-size: 16px; margin: 0; }
  .modal-close {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 14px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .modal-body { overflow-y: auto; padding: 12px 18px 18px; }

  .func-title { color: var(--accent); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin: 16px 0 8px; text-align: left; }
  .func-title:first-child { margin-top: 0; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { text-align: left; padding: 6px 8px; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--border); }
  tbody td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; }
  tbody tr:last-child td { border-bottom: none; }
  .badge { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 20px; white-space: nowrap; }
  .badge.reserva { background: #f59e0b22; color: #f5b04a; }
  .badge.ocupado { background: #ef444422; color: #f27171; }
  .badge.conadis { background: #2563eb22; color: #6f9dfa; }
  .modal-loading, .modal-error { text-align: center; color: var(--muted); padding: 20px 0; }
  .modal-error { color: #ef4444; }

  @media (max-width: 500px) {
    table { font-size: 11.5px; }
    thead th, tbody td { padding: 5px 4px; }
  }
</style>
</head>
<body>

<div class="gate-wrap" id="gate">
  <h1>🔒 Panel interno</h1>
  <input type="password" id="pwd-input" placeholder="Contraseña" autocomplete="off">
  <button type="button" id="pwd-submit">Entrar</button>
  <div class="gate-error" id="pwd-error"></div>
</div>

<div class="panel-wrap" id="panel">
  <h1>Panel interno</h1>
  <div class="subtitle">Una Aventura Congelada · Registro de asientos</div>
  <button type="button" class="open-btn" id="open-modal-btn">Ver lista de participantes</button>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <div class="modal-head">
      <h2>Participantes registrados</h2>
      <button type="button" class="modal-close" id="modal-close-btn">Cerrar ✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
  const PASSWORD = 'fr0zen';

  // Fuente: PUBLIC/asientos.json (fetch más abajo). El gate de contraseña es solo visual —
  // igual que antes, los datos se descargan de entrada sin esperar a que se ingrese la contraseña.
  let DATA = null;
  let dataError = false;

  fetch('/asientos.json')
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(data => {
      DATA = data.funciones;
      if (document.getElementById('modal-overlay').classList.contains('open')) {
        buildModalBody();
      }
    })
    .catch(err => {
      console.error('Error cargando asientos.json', err);
      dataError = true;
      if (document.getElementById('modal-overlay').classList.contains('open')) {
        buildModalBody();
      }
    });

  const gate = document.getElementById('gate');
  const panel = document.getElementById('panel');
  const pwdInput = document.getElementById('pwd-input');
  const pwdError = document.getElementById('pwd-error');

  function tryUnlock() {
    if (pwdInput.value === PASSWORD) {
      gate.style.display = 'none';
      panel.style.display = 'block';
    } else {
      pwdError.textContent = 'Contraseña incorrecta';
    }
  }
  document.getElementById('pwd-submit').addEventListener('click', tryUnlock);
  pwdInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });

  function buildModalBody() {
    const body = document.getElementById('modal-body');
    body.innerHTML = '';
    if (dataError) {
      body.innerHTML = '<div class="modal-error">No se pudo cargar la información. Intenta recargar la página.</div>';
      return;
    }
    if (!DATA) {
      body.innerHTML = '<div class="modal-loading">Cargando…</div>';
      return;
    }
    Object.keys(DATA).forEach(funcion => {
      const title = document.createElement('div');
      title.className = 'func-title';
      title.textContent = 'Función ' + funcion;
      body.appendChild(title);

      const table = document.createElement('table');
      table.innerHTML = `
        <thead><tr><th>Fila</th><th>Asiento</th><th>Estado</th><th>Nombre</th><th>Participante</th><th>F. Reserva</th><th>F. Pago</th></tr></thead>
        <tbody></tbody>`;
      const tbody = table.querySelector('tbody');
      DATA[funcion]
        .slice()
        .sort((a, b) => a.fila - b.fila || a.asiento - b.asiento)
        .forEach(row => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${row.fila}</td>
            <td>${row.asiento}</td>
            <td><span class="badge ${row.estado}">${row.estado}</span></td>
            <td>${row.nombre || '—'}</td>
            <td>${row.participante || '—'}</td>
            <td>${row.fechaReserva || '—'}</td>
            <td>${row.fechaPago || '—'}</td>`;
          tbody.appendChild(tr);
        });
      body.appendChild(table);
    });
  }

  document.getElementById('open-modal-btn').addEventListener('click', () => {
    buildModalBody();
    document.getElementById('modal-overlay').classList.add('open');
  });
  document.getElementById('modal-close-btn').addEventListener('click', () => {
    document.getElementById('modal-overlay').classList.remove('open');
  });
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target.id === 'modal-overlay') e.target.classList.remove('open');
  });
</script>
</body>
</html>
